name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deploy files
        run: |
          cp -R ./certificados ./portifolio/certificados
          cp ./Curriculo_Messias_Savio_Atualizado.pdf ./portifolio/Curriculo_Messias_Savio_Atualizado.pdf
          cp ./Resume_Messias_Savio_English.pdf ./portifolio/Resume_Messias_Savio_English.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./portifolio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
